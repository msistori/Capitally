<section class="recent-transactions">
  <h3>{{ 'TRANSACTION.RECENT_TRANSACTIONS_TITLE' | translate }}</h3>
  <ul tabindex="0" [attr.aria-label]="'TRANSACTION.RECENT_TRANSACTIONS_TITLE' | translate" [attr.aria-busy]="loading">
    <li *ngFor="let tx of transactions">
      <button class="transaction-row" type="button" (click)="openEditTransaction(tx)">
        <div class="tx-info">
          <span class="tx-description">{{ tx.description }}</span>
          <span class="tx-date">{{ tx.date | date:'dd/MM/yyyy' }}</span>
        </div>
        <div class="tx-amount" [ngClass]="{
          'positive': tx.transactionType === TransactionTypeEnum.INCOME,
          'negative': tx.transactionType === TransactionTypeEnum.EXPENSE }">
          {{ tx.amount | currency: (tx.currencyCode ? tx.currencyCode : 'EUR'):'symbol-narrow' }}
        </div>
      </button>
    </li>
    <li class="list-actions" *ngIf="hasMore">
      <p *ngIf="loadFailed" role="alert">{{ 'TRANSACTION.RECENT_LOAD_ERROR' | translate }}</p>
      <button class="load-more" type="button" [disabled]="loading" (click)="loadMoreTransactions()">
        {{ (loading ? 'TRANSACTION.RECENT_LOADING' : loadFailed ? 'TRANSACTION.RECENT_RETRY' : 'TRANSACTION.RECENT_LOAD_MORE') | translate }}
      </button>
    </li>
  </ul>
</section>
